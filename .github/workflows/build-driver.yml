name: Build Driver

# 在 GitHub 云端编译内核驱动，产出 andun.sys
#
# 为什么用 CI 而不是本机：
#   编内核驱动必须有 WDK + MSVC。WDK 约 1 GB、MSVC 约 4 GB，装在本机很重；
#   GitHub 的 windows runner 自带 MSVC，只要补装 WDK 就能编，几分钟出一个 .sys。
#   这也是绝大多数「GitHub 上能看到 .sys」的项目实际的做法。
#
# 修订 2026-10-18：
#   第 1 次运行在「安装 WDK」这步失败。原因是我把 go.microsoft.com/fwlink 的
#   落地页当成安装包了 —— 那个链接返回的是 15 KB 的 HTML，不是 exe。
#   现改为 winget 安装（有官方包 Microsoft.WindowsWDK.10.0.22621），
#   失败时回退到已验证是真实安装包的 fwlink（1.3 MB）。

on:
  workflow_dispatch:          # 手动触发
  push:
    paths:
      - 'driver/**'           # 驱动源码一改就自动编
      - '.github/workflows/build-driver.yml'

jobs:
  build-driver:
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: write        # 失败时要把 build.log 提交回仓库

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 WDK
        shell: pwsh
        run: |
          Write-Host "=== 系统信息 ==="
          Get-CimInstance Win32_OperatingSystem |
            ForEach-Object { Write-Host "  $($_.Caption) build $($_.BuildNumber)" }
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  已有 Include: $($_.Name)" }

          $installed = $false
          try {
            Write-Host "=== winget 安装 Microsoft.WindowsWDK.10.0.22621 ==="
            winget install --id Microsoft.WindowsWDK.10.0.22621 `
              --silent --accept-package-agreements --accept-source-agreements `
              --disable-interactivity 2>&1 | ForEach-Object { Write-Host "  $_" }
            if ($LASTEXITCODE -eq 0) { $installed = $true }
            else { Write-Host "  winget 退出码 $LASTEXITCODE" }
          } catch {
            Write-Host "  winget 失败: $_"
          }

          if (-not $installed) {
            Write-Host "=== 回退：直接下载 wdksetup.exe ==="
            $url = 'https://go.microsoft.com/fwlink/?linkid=2196230'
            $out = "$env:RUNNER_TEMP\wdksetup.exe"
            Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
            $sz = (Get-Item $out).Length
            Write-Host "  下载完成: $sz 字节"
            if ($sz -lt 500000) {
              Write-Error "下载到的不是安装包（$sz 字节，太小，可能是 HTML 落地页）"
              exit 1
            }
            Write-Host "  静默安装..."
            Start-Process -FilePath $out -ArgumentList '/q','/norestart','/ceip','off' -Wait
          }

          Write-Host "=== 安装后检查 km 头文件 ==="
          $found = $false
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -ErrorAction SilentlyContinue |
            ForEach-Object {
              $has = Test-Path (Join-Path $_.FullName 'km')
              Write-Host ("  {0}  km={1}" -f $_.Name, $has)
              if ($has) { $found = $true }
            }
          if (-not $found) {
            Write-Error "WDK 装完了但没找到 km 头文件目录 —— 驱动无法编译"
            exit 1
          }

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # 必须显式指定 x64。这个 action 默认是 x86 工具链，
          # 而内核驱动要 /MACHINE:X64 —— 用 x86 的 cl 编 x64 驱动会出各种怪问题
          # （包括不报明确错误、只返回 255 这种）。
          arch: x64

      - name: 编译驱动
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\driver"
          echo === 工具链确认 === > build.log
          where cl >> build.log 2>&1
          where link >> build.log 2>&1
          cl 2>&1 | findstr /i "version" >> build.log
          echo. >> build.log
          echo === Windows Kits Include 目录 === >> build.log
          dir "C:\Program Files (x86)\Windows Kits\10\Include" >> build.log 2>&1
          echo. >> build.log
          echo === 各版本 km 头文件是否存在 === >> build.log
          for /d %%D in ("C:\Program Files (x86)\Windows Kits\10\Include\*") do (
            if exist "%%D\km" (echo   %%~nxD  km=YES >> build.log) else (echo   %%~nxD  km=no >> build.log)
          )
          echo. >> build.log
          echo === 开始编译 === >> build.log
          call build.bat release >> build.log 2>&1
          set RC=%errorlevel%
          echo === 完整日志（尾部 150 行）===
          powershell -NoProfile -Command "Get-Content build.log -Tail 150"
          echo.
          echo === 编译错误汇总 ===
          powershell -NoProfile -Command "$e = Select-String -Path build.log -Pattern 'error|错误|unexpected' -CaseSensitive:$false; if ($e) { $e | Select-Object -First 60 | ForEach-Object { Write-Host ('  ' + $_.Line) } } else { Write-Host '  （日志里没有 error 字样）' }"
          echo.
          if not %RC%==0 (
            echo ::error::驱动编译失败，exit %RC%
            exit /b 1
          )

      - name: 检查产物
        shell: pwsh
        run: |
          $sys = 'driver/andun.sys'
          if (-not (Test-Path $sys)) { Write-Error "没有产出 andun.sys"; exit 1 }
          $f = Get-Item $sys
          Write-Host ("  andun.sys  {0:N0} 字节" -f $f.Length)
          Write-Host "  SHA256: $((Get-FileHash $sys -Algorithm SHA256).Hash)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: andun-driver
          path: |
            driver/andun.sys
            driver/andun_driver/andun.inf
          if-no-files-found: error
          retention-days: 30

      # 以下两步只在失败时跑。
      # 目的是让日志「活下来」—— 之前 CI 失败后，GitHub API 匿名配额用完（403）、
      # 日志接口又要 token，导致完全看不到编译报错，只能靠人肉抄。
      # 这里直接把 build.log 提交回仓库（带 [skip ci] 防止再次触发），
      # 之后 git pull 就能看到完整报错。
      - name: 失败时回传编译日志
        if: failure()
        shell: pwsh
        run: |
          $log = 'driver/build.log'
          if (-not (Test-Path $log)) {
            Write-Host "没有 build.log，跳过"
            exit 0
          }
          $sz = (Get-Item $log).Length
          Write-Host "build.log 大小: $sz 字节"
          if ($sz -gt 200000) {
            Get-Content $log -Tail 3000 | Set-Content $log -Encoding UTF8
            Write-Host "  已截断到尾部 3000 行"
          }

          # 把错误行写进 job summary —— 这样在 run 页面上直接能看到，不用翻日志
          $errs = Select-String -Path $log -Pattern 'error C|error LNK|fatal error|unexpected at this time' |
                  Select-Object -First 50
          $md = "## 编译错误（前 50 条）`n`n``````n"
          if ($errs) { $md += (($errs | ForEach-Object { $_.Line.Trim() }) -join "`n") }
          else { $md += "（日志里没有 error 字样）" }
          $md += "`n``````n"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $md

          git config user.name 'ci-bot'
          git config user.email 'ci-bot@users.noreply.github.com'
          git add -f $log
          # --allow-empty: 内容没变也不让提交失败
          git commit -m "ci: 编译失败日志 [skip ci]" --allow-empty 2>&1 | Out-Null

          # 关键：用 HEAD:main 推。checkout 出来可能是 detached HEAD，
          # 直接 git push 会报 "not currently on a branch" —— 这大概就是
          # 上一轮日志没回传的原因。
          $pushed = $false
          for ($i = 1; $i -le 3; $i++) {
            $out = git push origin HEAD:main 2>&1
            $out | ForEach-Object { Write-Host "  push[$i] $_" }
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "  push 被拒，fetch + rebase 后重试"
            git fetch origin main 2>&1 | Out-Null
            git rebase origin/main 2>&1 | ForEach-Object { Write-Host "  rebase $_" }
            git add -f $log
            git commit -m "ci: 编译失败日志 [skip ci]" --allow-empty 2>&1 | Out-Null
            Start-Sleep -Seconds 3
          }
          if (-not $pushed) { Write-Host "::warning::日志回传失败，请从 job summary 或 artifact 取" }
